server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA entry. It contains the current hashed JS/CSS names.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Static files must either exist or return 404. Do not return index.html for
    # a missing image/script, otherwise browsers receive HTML as PNG/JS.
    location ~* ^/(assets|img|css|js|video|webm)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /api/ {
        proxy_pass http://app:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }

    # Vue production base URL is /pro-api. Strip that prefix before
    # forwarding so /pro-api/api/user/login reaches /api/user/login.
    location /pro-api/ {
        proxy_pass http://app:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass http://app:8083;
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
